<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق ورد - سلم مراتب الذكر</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- الخط العربي (Tajawal) -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics-compat.js"></script>

    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f1f5f9;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-slate-800 selection:bg-emerald-500 selection:text-white pb-10">

    <!-- 1. الهيدر العلوي الاحترافي -->
    <header class="bg-gradient-to-r from-emerald-950 via-emerald-900 to-teal-900 text-white px-4 py-4 shadow-md">
        <div class="max-w-xl mx-auto flex items-center justify-between">
            
            <!-- اليسار: أزرار الخروج والتحديث والآمان والوقت -->
            <div class="flex items-center gap-2">
                <button onclick="logout()" class="bg-emerald-900/80 hover:bg-emerald-800 border border-emerald-700/50 text-emerald-200 px-2.5 py-1 rounded-xl text-xs font-semibold flex items-center gap-1 transition active:scale-95">
                    <span>➔]</span> خروج
                </button>

                <!-- زر التحديث -->
                <button onclick="checkForUpdates()" class="bg-emerald-800/80 hover:bg-emerald-700/90 border border-emerald-600/50 text-emerald-100 px-2.5 py-1 rounded-xl text-xs font-bold flex items-center gap-1 transition active:scale-95 shadow-sm" title="فحص التحديثات">
                    <span id="updateIcon" class="inline-block transition-transform">🔄</span>
                    <span>تحديث</span>
                </button>

                <span class="bg-emerald-800/60 border border-emerald-600/40 text-emerald-300 px-2 py-1 rounded-xl text-xs flex items-center gap-1">
                    ☁️ آمن
                </span>

                <span id="currentTimeDisplay" class="text-xs text-emerald-200 font-mono dir-ltr hidden sm:inline-block">
                    12:00:00 م
                </span>
            </div>

            <!-- اليمين: اللوجو واسم المستخدم وحالة المزامنة -->
            <div class="flex items-center gap-3">
                <div class="text-right">
                    <div class="flex items-center gap-1">
                        <span class="text-lg font-black tracking-wide text-white">ورد</span>
                    </div>
                    <div class="text-[10px] text-emerald-300">محمد</div>
                </div>
                
                <span id="syncBadge" class="bg-emerald-700/80 text-white text-[11px] font-bold px-3 py-1 rounded-full flex items-center gap-1">
                    محفوظ ومزامَن
                </span>

                <div class="w-9 h-9 bg-emerald-700 border border-emerald-500 rounded-full flex items-center justify-center text-white text-sm">
                    👤
                </div>
            </div>

        </div>
    </header>

    <!-- 2. المحتوى الرئيسي -->
    <main class="max-w-xl mx-auto w-full px-4 mt-4 flex flex-col gap-4">

        <!-- لوحة التحكم بالمؤقت والإضافة/الخصم -->
        <section class="bg-white rounded-3xl p-5 shadow-sm border border-slate-200/80 text-center">
            
            <!-- عداد الساعات والدقائق اليومية -->
            <div class="mb-3">
                <span class="text-xs font-bold text-slate-400 block mb-1">إجمالي إنجازك اليوم</span>
                <span id="timerDisplay" class="text-4xl font-extrabold text-emerald-600 font-mono">
                    00:00:00
                </span>
            </div>

            <!-- زر بدء/إيقاف الجلسة -->
            <div class="flex justify-center mb-4">
                <button id="startBtn" onclick="toggleTimer()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2.5 rounded-2xl shadow-sm transition active:scale-95 text-sm flex items-center gap-2">
                    <span id="startIcon">▶</span> <span id="startText">بدء الجلسة</span>
                </button>
            </div>

            <!-- أزرار التحكم السريع (شاملة الخصم والمخصص) -->
            <div class="border-t border-slate-100 pt-3">
                <div class="text-xs font-semibold text-slate-500 mb-2">تسجيل سريع أو تصحيح:</div>
                <div class="flex flex-wrap gap-2 justify-center">
                    <button onclick="adjustMinutes(15)" class="bg-slate-50 hover:bg-emerald-50 border border-slate-200 text-emerald-700 font-bold px-3 py-1.5 rounded-xl text-xs transition active:scale-95">
                        +15 دقيقة
                    </button>
                    <button onclick="adjustMinutes(30)" class="bg-slate-50 hover:bg-emerald-50 border border-slate-200 text-emerald-700 font-bold px-3 py-1.5 rounded-xl text-xs transition active:scale-95">
                        +30 دقيقة
                    </button>
                    <button onclick="adjustMinutes(60)" class="bg-slate-50 hover:bg-emerald-50 border border-slate-200 text-emerald-700 font-bold px-3 py-1.5 rounded-xl text-xs transition active:scale-95">
                        +1 ساعة
                    </button>

                    <!-- زر الخصم -->
                    <button onclick="adjustMinutes(-60)" class="bg-rose-50 hover:bg-rose-100 border border-rose-200 text-rose-600 font-bold px-3 py-1.5 rounded-xl text-xs transition active:scale-95 flex items-center gap-1">
                        🗑️ خصم ساعة (-1س)
                    </button>
                    
                    <!-- زر الوقت المخصص -->
                    <button onclick="openCustomModal()" class="bg-slate-100 hover:bg-slate-200 border border-slate-300 text-slate-700 font-bold px-3 py-1.5 rounded-xl text-xs transition active:scale-95 flex items-center gap-1">
                        ⚙️ مخصص
                    </button>
                </div>
            </div>
        </section>

        <!-- بطاقة "سلم مراتب ودرجات الذكر" -->
        <section class="bg-white rounded-3xl p-5 shadow-sm border border-slate-200/80">
            <div class="flex items-center gap-2 mb-1">
                <span class="text-lg">📚</span>
                <h2 class="text-base font-bold text-slate-800">سلم مراتب ودرجات الذكر</h2>
            </div>
            <p class="text-xs text-slate-400 mb-4">التدرج الزمني اليومي للانتقال بين المقامات والدرجات:</p>

            <!-- قائمة المراتب -->
            <div id="tiersContainer" class="flex flex-col gap-2.5"></div>
        </section>

    </main>

    <!-- نافذة الوقت المخصص (Modal) -->
    <div id="customModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white border border-slate-200 rounded-3xl p-6 w-full max-w-xs shadow-xl">
            <h3 class="text-base font-bold text-slate-800 mb-1">إدخال أو خصم وقت مخصص</h3>
            <p class="text-xs text-slate-500 mb-4">أدخل الدقائق (استخدم إشارة - للخصم، مثل: -20)</p>
            
            <input type="number" id="customMinutesInput" placeholder="مثال: 45 أو -15" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-center font-bold text-slate-800 mb-4 focus:outline-none focus:ring-2 focus:ring-emerald-500">
            
            <div class="flex gap-2">
                <button onclick="closeCustomModal()" class="w-1/2 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold text-xs">إلغاء</button>
                <button onclick="applyCustomMinutes()" class="w-1/2 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-xs">تأكيد</button>
            </div>
        </div>
    </div>

    <!-- إشعار سريع أنيق (Toast) -->
    <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-5 py-2.5 rounded-2xl text-xs font-bold shadow-xl opacity-0 transition-opacity duration-300 pointer-events-none z-50">
        تم تحديث البيانات
    </div>

    <!-- JavaScript Logic -->
    <script>
        // --- 1. إعدادات Firebase الخاصة بالمشروع (wird-7cfbe) ---
        const firebaseConfig = {
            apiKey: "AIzaSyCOstJoI5KKmBWFp8XoTahkZ1RJ_ggD0tY",
            authDomain: "wird-7cfbe.firebaseapp.com",
            projectId: "wird-7cfbe",
            storageBucket: "wird-7cfbe.firebasestorage.app",
            messagingSenderId: "1037841919563",
            appId: "1:1037841919563:web:98f2fcf039f3e7796967ce",
            measurementId: "G-NTQBWC1WLW"
        };

        let db = null;
        let analytics = null;

        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.firestore();
            analytics = firebase.analytics();
        } catch (e) {
            console.warn("Firebase المحلي:", e);
        }

        // --- 2. بيانات مراتب الذكر ---
        const TIERS_DATA = [
            { id: 'gafil', name: 'الغافل', range: '0 دقيقة', minMins: 0, maxMins: 0, icon: '🌙' },
            { id: 'mustayqiz', name: 'المستيقظ', range: '1 إلى 10 دقائق', minMins: 1, maxMins: 10, icon: '☀️' },
            { id: 'zakir', name: 'الذاكر', range: '10 إلى 30 دقيقة', minMins: 10, maxMins: 30, icon: '🍃' },
            { id: 'hazir', name: 'الحاضر', range: '30 دقيقة إلى ساعة', minMins: 30, maxMins: 60, icon: '💚' },
            { id: 'mudawim', name: 'المداوم', range: '1 إلى 3 ساعات', minMins: 60, maxMins: 180, icon: '🕒' },
            { id: 'mushahid', name: 'المُشَاهِد', range: '3 إلى 6 ساعات', minMins: 180, maxMins: 360, icon: '👁️' },
            { id: 'munqati', name: 'المُنْقَطِع', range: '6 إلى 12 ساعة', minMins: 360, maxMins: 720, icon: '🔺' },
            { id: 'fani', name: 'الفاني', range: '12 إلى 16 ساعة', minMins: 720, maxMins: 960, icon: '🔥' },
            { id: 'baqi', name: 'الباقي', range: 'كل ساعات اليقظة', minMins: 960, maxMins: 99999, icon: '♾️' }
        ];

        let totalMinutesToday = 0;
        let isTimerRunning = false;
        let timerSeconds = 0;
        let timerInterval = null;

        // --- 3. البدء عند فتح التطبيق ---
        window.addEventListener('DOMContentLoaded', () => {
            loadSavedData();
            startClock();
            renderTiers();
        });

        function startClock() {
            setInterval(() => {
                const now = new Date();
                const clockEl = document.getElementById('currentTimeDisplay');
                if (clockEl) clockEl.innerText = now.toLocaleTimeString('ar-EG');
            }, 1000);
        }

        async function loadSavedData() {
            const saved = localStorage.getItem('wird_today_minutes');
            if (saved !== null) {
                totalMinutesToday = parseInt(saved, 10) || 0;
                updateTimerDisplayFromTotal();
                renderTiers();
            }

            if (db) {
                try {
                    const doc = await db.collection("users").doc("mohamed_data").get();
                    if (doc.exists && doc.data().totalMinutes !== undefined) {
                        totalMinutesToday = doc.data().totalMinutes;
                        localStorage.setItem('wird_today_minutes', totalMinutesToday);
                        updateTimerDisplayFromTotal();
                        renderTiers();
                    }
                } catch (err) {
                    console.log("استخدام التخزين المحلي:", err);
                }
            }
        }

        function saveData() {
            localStorage.setItem('wird_today_minutes', totalMinutesToday);
            renderTiers();
            updateTimerDisplayFromTotal();

            if (db) {
                db.collection("users").doc("mohamed_data").set({
                    totalMinutes: totalMinutesToday,
                    lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true }).catch(err => console.error("خطأ حفظ السحابة:", err));
            }
        }

        // --- 4. فحص التحديثات ---
        async function checkForUpdates() {
            const icon = document.getElementById('updateIcon');
            if (icon) icon.classList.add('animate-spin');

            let isUpdated = false;

            try {
                if (db) {
                    const doc = await db.collection("users").doc("mohamed_data").get();
                    if (doc.exists) {
                        const remoteValue = doc.data().totalMinutes;
                        if (remoteValue !== undefined && remoteValue !== totalMinutesToday) {
                            totalMinutesToday = remoteValue;
                            saveData();
                            isUpdated = true;
                        }
                    }
                } else {
                    const saved = localStorage.getItem('wird_today_minutes');
                    if (saved !== null) {
                        const parsed = parseInt(saved, 10);
                        if (parsed !== totalMinutesToday) {
                            totalMinutesToday = parsed;
                            renderTiers();
                            updateTimerDisplayFromTotal();
                            isUpdated = true;
                        }
                    }
                }
            } catch (error) {
                console.error("خطأ التحديث:", error);
            }

            setTimeout(() => {
                if (icon) icon.classList.remove('animate-spin');
                
                if (isUpdated) {
                    showToast("✨ تم التحديث بنجاح من السحابة");
                } else {
                    showToast("✅ أنت تستعمل آخر نسخة");
                }
            }, 600);
        }

        // --- 5. منطق الإضافة والخصم ---
        function adjustMinutes(mins) {
            totalMinutesToday = Math.max(0, totalMinutesToday + mins);
            saveData();
            
            if (mins > 0) {
                showToast(`➕ تمت إضافة ${mins} دقيقة`);
            } else if (mins < 0) {
                showToast(`🗑️ تم خصم ${Math.abs(mins)} دقيقة`);
            }
        }

        function openCustomModal() {
            document.getElementById('customModal').classList.remove('hidden');
        }
        function closeCustomModal() {
            document.getElementById('customModal').classList.add('hidden');
            document.getElementById('customMinutesInput').value = '';
        }
        function applyCustomMinutes() {
            const val = parseInt(document.getElementById('customMinutesInput').value, 10);
            if (!isNaN(val) && val !== 0) {
                adjustMinutes(val);
            }
            closeCustomModal();
        }

        // --- 6. رندر المراتب ---
        function renderTiers() {
            const container = document.getElementById('tiersContainer');
            container.innerHTML = '';

            TIERS_DATA.forEach(tier => {
                let isActive = false;
                if (tier.minMins === 0 && totalMinutesToday === 0) {
                    isActive = true;
                } else if (tier.minMins > 0 && totalMinutesToday >= tier.minMins && (totalMinutesToday < tier.maxMins || tier.maxMins === 99999)) {
                    isActive = true;
                }

                const card = document.createElement('div');
                
                if (isActive) {
                    card.className = "flex items-center justify-between p-3.5 bg-emerald-50/40 border-2 border-teal-300 rounded-2xl shadow-sm transition-all";
                    card.innerHTML = `
                        <div class="flex items-center gap-2">
                            <span class="bg-emerald-600 text-white text-[11px] font-bold px-2.5 py-0.5 rounded-full shadow-sm">
                                مرتبتك اليوم
                            </span>
                            <div class="text-right">
                                <div class="font-extrabold text-slate-800 text-sm">${tier.name}</div>
                                <div class="text-[11px] text-slate-500">${tier.range}</div>
                            </div>
                        </div>
                        <div class="w-8 h-8 rounded-full bg-teal-100 flex items-center justify-center text-teal-700 text-base">
                            ${tier.icon}
                        </div>
                    `;
                } else {
                    card.className = "flex items-center justify-between p-3.5 bg-slate-50 border border-slate-100 rounded-2xl opacity-90";
                    card.innerHTML = `
                        <div class="text-right">
                            <div class="font-bold text-slate-700 text-sm">${tier.name}</div>
                            <div class="text-[11px] text-slate-400">${tier.range}</div>
                        </div>
                        <div class="w-8 h-8 rounded-full bg-slate-200/50 flex items-center justify-center text-slate-500 text-sm">
                            ${tier.icon}
                        </div>
                    `;
                }

                container.appendChild(card);
            });
        }

        // --- 7. تشغيل المؤقت ---
        function toggleTimer() {
            if (isTimerRunning) {
                isTimerRunning = false;
                clearInterval(timerInterval);
                document.getElementById('startText').innerText = "متابعة الجلسة";
                document.getElementById('startIcon').innerText = "▶";
                document.getElementById('startBtn').classList.replace('bg-amber-600', 'bg-emerald-600');
            } else {
                isTimerRunning = true;
                document.getElementById('startText').innerText = "إيقاف مؤقت";
                document.getElementById('startIcon').innerText = "⏸";
                document.getElementById('startBtn').classList.replace('bg-emerald-600', 'bg-amber-600');

                timerInterval = setInterval(() => {
                    timerSeconds++;
                    if (timerSeconds % 60 === 0) {
                        totalMinutesToday++;
                        saveData();
                    }
                    updateTimerDisplayFromTotal();
                }, 1000);
            }
        }

        function updateTimerDisplayFromTotal() {
            const hrs = Math.floor(totalMinutesToday / 60).toString().padStart(2, '0');
            const mins = (totalMinutesToday % 60).toString().padStart(2, '0');
            const secs = (timerSeconds % 60).toString().padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `${hrs}:${mins}:${secs}`;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2500);
        }

        // --- 8. عملية تسجيل الخروج الحقيقية والمعدلة ---
        function logout() {
            // 1. إيقاف العداد فوراً إذا كان يعمل
            if (isTimerRunning) {
                isTimerRunning = false;
                clearInterval(timerInterval);
            }

            // 2. تسجيل الخروج السحابي
            if (typeof firebase !== 'undefined' && firebase.auth) {
                firebase.auth().signOut().catch(err => console.error(err));
            }

            // 3. تنظيف البيانات والذاكرة المحلية
            localStorage.removeItem('wird_today_minutes');
            totalMinutesToday = 0;
            timerSeconds = 0;

            // 4. إظهار الإشعار وإعادة تحميل الواجهة بسلاسة
            showToast("🚪 تم تسجيل الخروج بنجاح..");
            
            setTimeout(() => {
                window.location.reload();
            }, 1000);
        }
    </script>
</body>
</html>
